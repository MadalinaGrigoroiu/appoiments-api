{% extends "base.html" %}

{% block title %}Services - Appointments APP{% endblock %}

{% block content %}
<h1> Manage Services</h1>

<!-- Add Service Form -->
<div class="form-container">
    <h2>Add New Service</h2>
    <form id="serviceForm">
        <div class="form-row">
            <div class="form-group">
                <label for="serviceName">Service Name *</label>
                <input type="text" id="serviceName" placeholder="e.g., Haircut, Massage" required>
            </div>
            <div class="form-group">
                <label for="servicePrice">Price (€) *</label>
                <input type="number" id="servicePrice" placeholder="29.99" step="0.01" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="serviceDuration">Duration (minutes) *</label>
                <input type="number" id="serviceDuration" placeholder="30" required>
            </div>
            <div class="form-group">
                <label for="serviceDescription">Description</label>
                <input type="text" id="serviceDescription" placeholder="Brief description of the service">
            </div>
        </div>
        <button type="button" onclick="addService()">➕ Add Service</button>
    </form>
</div>

<!-- Services Table -->
<h2>All Services</h2>
<table id="servicesTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Duration (min)</th>
            <th>Price (€)</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td colspan="6" style="text-align: center; color: #999;">Loading...</td>
        </tr>
    </tbody>
</table>

<script>
let services = [];

// Load all services
async function loadServices() {
    try {
        const response = await fetch('/api/services');
        if (!response.ok) throw new Error('Failed to load services');
        
        const data = await response.json();
        services = Array.isArray(data) ? data : [];
        renderServicesTable();
    } catch (error) {
        console.error('Error loading services:', error);
        showError('Failed to load services');
    }
}

// Render services in table
function renderServicesTable() {
    const tbody = document.querySelector('#servicesTable tbody');
    
    if (services.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999;">No services yet</td></tr>';
        return;
    }
    
    tbody.innerHTML = services.map(service => `
        <tr>
            <td>${service.id}</td>
            <td>${service.name}</td>
            <td>${service.description || '-'}</td>
            <td>${service.duration_minutes}</td>
            <td>€${parseFloat(service.price).toFixed(2)}</td>
            <td>
                <button onclick="editService(${service.id})" style="margin-right: 10px;">✏️ Edit</button>
                <button onclick="deleteService(${service.id})" style="color: #d9534f;">🗑️ Delete</button>
            </td>
        </tr>
    `).join('');
}

// Add new service
async function addService() {
    const name = document.getElementById('serviceName').value.trim();
    const price = parseFloat(document.getElementById('servicePrice').value);
    const duration_minutes = parseInt(document.getElementById('serviceDuration').value);
    const description = document.getElementById('serviceDescription').value.trim();
    
    if (!name || !price || !duration_minutes) {
        showError('Please fill in all required fields');
        return;
    }
    
    if (price <= 0 || duration_minutes <= 0) {
        showError('Price and duration must be positive numbers');
        return;
    }
    
    try {
        const response = await fetch('/api/services', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name,
                price,
                duration_minutes,
                description: description || null
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to add service');
        }
        
        showSuccess('Service added successfully!');
        document.getElementById('serviceForm').reset();
        loadServices();
    } catch (error) {
        console.error('Error adding service:', error);
        showError(error.message);
    }
}

// Edit service
async function editService(serviceId) {
    const service = services.find(s => s.id === serviceId);
    if (!service) return;
    
    const newName = prompt('Enter service name:', service.name);
    if (!newName) return;
    
    const newPrice = prompt('Enter price (€):', service.price);
    if (!newPrice) return;
    
    const newDuration = prompt('Enter duration (minutes):', service.duration_minutes);
    if (!newDuration) return;
    
    const newDescription = prompt('Enter description:', service.description || '');
    if (newDescription === null) return;
    
    try {
        const response = await fetch(`/api/services/${serviceId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: newName,
                price: parseFloat(newPrice),
                duration_minutes: parseInt(newDuration),
                description: newDescription || null
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to update service');
        }
        
        showSuccess('Service updated successfully!');
        loadServices();
    } catch (error) {
        console.error('Error updating service:', error);
        showError(error.message);
    }
}

// Delete service
async function deleteService(serviceId) {
    if (!confirm('Are you sure you want to delete this service?')) return;
    
    try {
        const response = await fetch(`/api/services/${serviceId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to delete service');
        }
        
        showSuccess('Service deleted successfully!');
        loadServices();
    } catch (error) {
        console.error('Error deleting service:', error);
        showError(error.message);
    }
}

// Helper functions
function showSuccess(message) {
    alert('success ' + message);
}

function showError(message) {
    alert('error ' + message);
}

// Load services when page loads
document.addEventListener('DOMContentLoaded', loadServices);
</script>
{% endblock %}
