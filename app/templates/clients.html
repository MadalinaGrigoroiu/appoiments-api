{% extends "base.html" %}

{% block title %}Clients - Appointments Management{% endblock %}

{% block content %}
<h1>👥 Manage Clients</h1>

<!-- Add Client Form -->
<div class="form-container">
    <h2>Add New Client</h2>
    <form id="clientForm">
        <div class="form-row">
            <div class="form-group">
                <label for="clientName">Full Name *</label>
                <input type="text" id="clientName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="clientEmail">Email *</label>
                <input type="email" id="clientEmail" placeholder="john@example.com" required>
            </div>
        </div>
        <div class="form-group">
            <label for="clientPhone">Phone *</label>
            <input type="text" id="clientPhone" placeholder="+40712345678" required>
        </div>
        <button type="button" onclick="addClient()">➕ Add Client</button>
    </form>
</div>

<!-- Clients Table -->
<h2>All Clients</h2>
<table id="clientsTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td colspan="5" style="text-align: center; color: #999;">Loading...</td>
        </tr>
    </tbody>
</table>

<script>
let clients = [];

// Load all clients from API
async function loadClients() {
    try {
        const response = await fetch('/api/clients');
        if (!response.ok) throw new Error('Failed to load clients');
        
        const data = await response.json();
        clients = Array.isArray(data) ? data : [];
        renderClientsTable();
    } catch (error) {
        console.error('Error loading clients:', error);
        showError('Failed to load clients');
    }
}

// Render clients in table
function renderClientsTable() {
    const tbody = document.querySelector('#clientsTable tbody');
    
    if (clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">No clients yet</td></tr>';
        return;
    }
    
    tbody.innerHTML = clients.map(client => `
        <tr>
            <td>${client.id}</td>
            <td>${client.name}</td>
            <td>${client.email}</td>
            <td>${client.phone}</td>
            <td>
                <button onclick="editClient(${client.id})" style="margin-right: 10px;">✏️ Edit</button>
                <button onclick="deleteClient(${client.id})" style="color: #d9534f;">🗑️ Delete</button>
            </td>
        </tr>
    `).join('');
}

// Add new client
async function addClient() {
    const name = document.getElementById('clientName').value.trim();
    const email = document.getElementById('clientEmail').value.trim();
    const phone = document.getElementById('clientPhone').value.trim();
    
    if (!name || !email || !phone) {
        showError('Please fill in all fields');
        return;
    }
    
    try {
        const response = await fetch('/api/clients', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to add client');
        }
        
        showSuccess('Client added successfully!');
        document.getElementById('clientForm').reset();
        loadClients();
    } catch (error) {
        console.error('Error adding client:', error);
        showError(error.message);
    }
}

// Edit client
async function editClient(clientId) {
    const client = clients.find(c => c.id === clientId);
    if (!client) return;
    
    const newName = prompt('Enter new name:', client.name);
    if (!newName) return;
    
    const newEmail = prompt('Enter new email:', client.email);
    if (!newEmail) return;
    
    const newPhone = prompt('Enter new phone:', client.phone);
    if (!newPhone) return;
    
    try {
        const response = await fetch(`/api/clients/${clientId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName, email: newEmail, phone: newPhone })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to update client');
        }
        
        showSuccess('Client updated successfully!');
        loadClients();
    } catch (error) {
        console.error('Error updating client:', error);
        showError(error.message);
    }
}

// Delete client
async function deleteClient(clientId) {
    if (!confirm('Are you sure you want to delete this client?')) return;
    
    try {
        const response = await fetch(`/api/clients/${clientId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to delete client');
        }
        
        showSuccess('Client deleted successfully!');
        loadClients();
    } catch (error) {
        console.error('Error deleting client:', error);
        showError(error.message);
    }
}

// Helper functions
function showSuccess(message) {
    alert('✅ ' + message);
}

function showError(message) {
    alert('❌ ' + message);
}

// Load clients when page loads
document.addEventListener('DOMContentLoaded', loadClients);
</script>
{% endblock %}
