{% extends "base.html" %}

{% block title %}Appointments - Appointments APP{% endblock %}

{% block content %}
<h1>  Manage Appointments</h1>

<!-- Add Appointment Form -->
<div class="form-container">
    <h2>Book New Appointment</h2>
    <form id="appointmentForm">
        <div class="form-row">
            <div class="form-group">
                <label for="appointmentClient">Client *</label>
                <select id="appointmentClient" required>
                    <option value="">Select a client...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="appointmentService">Service *</label>
                <select id="appointmentService" required>
                    <option value="">Select a service...</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="appointmentDate">Date & Time *</label>
                <input type="datetime-local" id="appointmentDate" required>
            </div>
            <div class="form-group">
                <label for="appointmentNotes">Notes</label>
                <input type="text" id="appointmentNotes" placeholder="Additional notes...">
            </div>
        </div>
        <button type="button" onclick="addAppointment()">📅 Book Appointment</button>
    </form>
</div>

<!-- Appointments Table -->
<h2>All Appointments</h2>
<table id="appointmentsTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Client</th>
            <th>Service</th>
            <th>Date & Time</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td colspan="7" style="text-align: center; color: #999;">Loading...</td>
        </tr>
    </tbody>
</table>

<script>
let appointments = [];
let clients = [];
let services = [];

// Load all data
async function loadAllData() {
    await loadClients();
    await loadServices();
    await loadAppointments();
}

// Load clients for dropdown
async function loadClients() {
    try {
        const response = await fetch('/api/clients');
        if (!response.ok) throw new Error('Failed to load clients');
        
        const data = await response.json();
        clients = Array.isArray(data) ? data : [];
        
        const select = document.getElementById('appointmentClient');
        select.innerHTML = '<option value="">Select a client...</option>';
        clients.forEach(client => {
            const option = document.createElement('option');
            option.value = client.id;
            option.textContent = client.name;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading clients:', error);
    }
}

// Load services for dropdown
async function loadServices() {
    try {
        const response = await fetch('/api/services');
        if (!response.ok) throw new Error('Failed to load services');
        
        const data = await response.json();
        services = Array.isArray(data) ? data : [];
        
        const select = document.getElementById('appointmentService');
        select.innerHTML = '<option value="">Select a service...</option>';
        services.forEach(service => {
            const option = document.createElement('option');
            option.value = service.id;
            option.textContent = `${service.name} (${service.duration_minutes} min - €${service.price})`;
            select.appendChild(option);
        });
    } catch (error) {
        console.error('Error loading services:', error);
    }
}

// Load all appointments
async function loadAppointments() {
    try {
        const response = await fetch('/api/appointments');
        if (!response.ok) throw new Error('Failed to load appointments');
        
        const data = await response.json();
        appointments = Array.isArray(data) ? data : [];
        renderAppointmentsTable();
    } catch (error) {
        console.error('Error loading appointments:', error);
        showError('Failed to load appointments');
    }
}

// Render appointments in table
function renderAppointmentsTable() {
    const tbody = document.querySelector('#appointmentsTable tbody');
    
    if (appointments.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #999;">No appointments yet</td></tr>';
        return;
    }
    
    tbody.innerHTML = appointments.map(apt => {
        const client = clients.find(c => c.id === apt.client_id);
        const service = services.find(s => s.id === apt.service_id);
        const date = new Date(apt.appointment_date).toLocaleString('ro-RO');
        const status = apt.status || 'pending';
        
        return `
            <tr>
                <td>${apt.id}</td>
                <td>${client ? client.name : 'N/A'}</td>
                <td>${service ? service.name : 'N/A'}</td>
                <td>${date}</td>
                <td>${status}</td>
                <td>${apt.notes || '-'}</td>
                <td>
                    <button onclick="editAppointment(${apt.id})" style="margin-right: 10px;">✏️ Edit</button>
                    <button onclick="deleteAppointment(${apt.id})" style="color: #d9534f;">🗑️ Delete</button>
                </td>
            </tr>
        `;
    }).join('');
}

// Add new appointment
async function addAppointment() {
    const clientId = document.getElementById('appointmentClient').value;
    const serviceId = document.getElementById('appointmentService').value;
    const appointmentDate = document.getElementById('appointmentDate').value;
    const notes = document.getElementById('appointmentNotes').value.trim();
    
    if (!clientId || !serviceId || !appointmentDate) {
        showError('Please fill in all required fields');
        return;
    }
    
    try {
        const response = await fetch('/api/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                client_id: parseInt(clientId),
                service_id: parseInt(serviceId),
                appointment_date: new Date(appointmentDate).toISOString(),
                notes: notes || null
            })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to add appointment');
        }
        
        showSuccess('Appointment booked successfully!');
        document.getElementById('appointmentForm').reset();
        loadAppointments();
    } catch (error) {
        console.error('Error adding appointment:', error);
        showError(error.message);
    }
}

// Edit appointment
async function editAppointment(appointmentId) {
    const apt = appointments.find(a => a.id === appointmentId);
    if (!apt) return;
    
    const newStatus = prompt(`Current status: ${apt.status || 'pending'}\nEnter new status (pending/confirmed/completed/cancelled):`, apt.status || 'pending');
    if (!newStatus) return;
    
    try {
        const response = await fetch(`/api/appointments/${appointmentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to update appointment');
        }
        
        showSuccess('Appointment updated successfully!');
        loadAppointments();
    } catch (error) {
        console.error('Error updating appointment:', error);
        showError(error.message);
    }
}

// Delete appointment
async function deleteAppointment(appointmentId) {
    if (!confirm('Are you sure you want to delete this appointment?')) return;
    
    try {
        const response = await fetch(`/api/appointments/${appointmentId}`, {
            method: 'DELETE'
        });
        
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.error || 'Failed to delete appointment');
        }
        
        showSuccess('Appointment deleted successfully!');
        loadAppointments();
    } catch (error) {
        console.error('Error deleting appointment:', error);
        showError(error.message);
    }
}

// Helper functions
function showSuccess(message) {
    alert('success ' + message);
}

function showError(message) {
    alert('error ' + message);
}

// Load all data when page loads
document.addEventListener('DOMContentLoaded', loadAllData);
</script>
{% endblock %}
